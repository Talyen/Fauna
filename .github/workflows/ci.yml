name: Verify Fauna
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: Browser shard count for comparable CI benchmarks
        type: choice
        options: ["1", "4", "8"]
        default: "8"
      browser_runtime:
        description: Compare headless-shell installation with the version-matched Playwright image
        type: choice
        options: ["install", "container"]
        default: "container"
      browser_workers:
        description: Workers per browser job; compare eight jobs with one worker against four jobs with two
        type: choice
        options: ["1", "2"]
        default: "1"
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      attempt: ${{ steps.plan.outputs.attempt }}
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      workers: ${{ steps.plan.outputs.workers }}
      browser_image: ${{ steps.plan.outputs.browser_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .node-version
            package-lock.json
            scripts/ci/ci.mjs
            scripts/lib/tool-runtime.mjs
            scripts/lib/interaction-replay.mjs
            scripts/ci/unit-shards.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: plan
        name: Choose shards and suppress duplicate branch runs
        run: node scripts/ci/ci.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  static:
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.complete.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Verify release version
        run: npm run verify:release-version
      - name: Draft unreleased player notes
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run generate:patch-notes
      - name: Draft tagged player notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run generate:patch-notes -- --tag "$RELEASE_TAG"
      - name: Dependency security
        run: npm run security:audit
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          path: reports/security/
      - name: Type checking
        if: ${{ !cancelled() }}
        run: npm run check:types
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run check:lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run check:format
      - name: Architecture and UI boundaries
        if: ${{ !cancelled() }}
        run: npm run check:boundaries
      - name: Unused code and dependencies
        if: ${{ !cancelled() }}
        run: npm run deadcode
      - name: Documentation contracts
        run: npm run docs:check
      - name: Content audit
        run: npm run content:audit
      - name: Upload player-notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: player-notes
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            reports/release-notes/
      - id: complete
        name: Record successful workflow attempt
        run: node scripts/ci/ci.mjs stamp

  unit:
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.complete.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Discover complete unit and exhaustive coverage
        run: npx vitest list --json=reports/ci/unit-discovery.json --staticParse=false
      - name: Unit and DOM suites
        run: npm run test:full -- --exclude='tests/exhaustive/**' --reporter=default --reporter=json --outputFile.json=reports/vitest.json
      - name: Summarize unit results
        if: always()
        run: node scripts/ci/ci-summarize.mjs vitest reports/vitest.json
      - name: Record unit evidence identity
        if: always()
        run: node scripts/ci/ci.mjs unit
      - name: Upload unit-results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-results
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            reports/vitest.json
            reports/ci/unit.json
            reports/ci/unit-discovery.json
            reports/ci/playthrough-timings.json
      - id: complete
        name: Record successful workflow attempt
        run: node scripts/ci/ci.mjs stamp

  lineups:
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      FAUNA_LINEUP_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Exhaustive lineup shard
        run: npm run test:full -- tests/exhaustive/roster-combinations.test.ts --reporter=default --reporter=json --outputFile.json=reports/vitest.json
      - name: Summarize lineup results
        if: always()
        run: node scripts/ci/ci-summarize.mjs vitest reports/vitest.json
      - name: Record lineup evidence identity
        if: always()
        run: node scripts/ci/ci.mjs lineup
      - name: Upload lineup-results-${{ matrix.shard }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lineup-results-${{ matrix.shard }}
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            reports/vitest.json
            reports/ci/lineup.json

  build:
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_SHARDS: ${{ needs.prepare.outputs.total }}
      CI_BROWSER_WORKERS: ${{ needs.prepare.outputs.workers }}
    outputs:
      attempt: ${{ steps.complete.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Build production browser assets
        run: |
          mkdir -p reports/resources
          /usr/bin/time -v -o reports/resources/build-memory.txt npm run build
          npm run resources -- --out reports/resources/browser.json
      - name: Retain resource inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resource-inventory
          retention-days: 7
          path: reports/resources/
      - name: Bundle allowance
        run: npm run check:bundle
      - name: Bundled asset contract
        run: npm run assets:check:bundle
      - name: Discover the complete browser suite
        run: |
          mkdir -p reports/ci
          npx playwright test --list --reporter=json > reports/ci/discovery.json
      - name: Balance complete browser coverage by duration
        run: node scripts/ci/ci.mjs plan
      - name: Record exact build identity
        run: node scripts/ci/ci.mjs build
      - name: Upload browser-build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-build
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/
      - name: Upload browser-manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-manifest
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            reports/ci/
      - id: complete
        name: Record successful workflow attempt
        run: node scripts/ci/ci.mjs stamp

  browser:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    container: ${{ needs.prepare.outputs.browser_image || null }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      FAUNA_BROWSER_IMAGE: ${{ needs.prepare.outputs.browser_image }}
      CI_SHARD: ${{ matrix.shard }}
      CI_SHARDS: ${{ needs.prepare.outputs.total }}
      CI_BROWSER_WORKERS: ${{ needs.prepare.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            src
            tests
      - name: Trust the mounted container checkout
        if: ${{ needs.prepare.outputs.browser_image != '' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Download browser-build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-build
          path: dist
      - name: Download browser-manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-manifest
          path: reports/ci
      - name: Verify downloaded build identity
        run: node scripts/ci/ci.mjs verify-build
      - name: Install Chromium
        if: ${{ needs.prepare.outputs.browser_image == '' }}
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser shard
        run: npx playwright test --workers=$CI_BROWSER_WORKERS --test-list=reports/ci/shard-$CI_SHARD.txt
      - name: Record shard identity
        if: always()
        run: node scripts/ci/ci.mjs shard
      - name: Upload browser-shard-${{ matrix.shard }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-shard-${{ matrix.shard }}
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            blob-report/
            reports/playwright.json
            reports/ci/shard.json
  interactions:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    container: ${{ needs.prepare.outputs.browser_image || null }}
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.complete.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            src
            tests
      - name: Trust the mounted container checkout
        if: ${{ needs.prepare.outputs.browser_image != '' }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Download browser-build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-build
          path: dist
      - name: Download browser-manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-manifest
          path: reports/ci
      - name: Verify downloaded build identity
        run: node scripts/ci/ci.mjs verify-build
      - name: Install Chromium
        if: ${{ needs.prepare.outputs.browser_image == '' }}
        run: npx playwright install --with-deps --only-shell chromium
      - name: Seeded interaction replay
        run: npm run test:interactions -- --seed 42 --steps 12 --out reports/interactions/ci
      - name: Record interaction build identity
        if: always()
        run: node scripts/ci/ci.mjs interaction
      - name: Upload interaction-results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: interaction-results
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            reports/interactions/
      - id: complete
        name: Record successful workflow attempt
        run: node scripts/ci/ci.mjs stamp

  windows:
    needs: [prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    outputs:
      attempt: ${{ steps.complete.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Verify release version
        run: npm run verify:release-version
      - name: Package Windows
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify package
        run: npm run verify:package
      - name: Inventory packaged size
        run: npm run resources -- --out reports/resources/windows.json
      - name: Inventory packaged components
        run: npm run generate:release-inventory -- --package release/win-unpacked
      - name: Verify tagged release identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run verify:release
      - name: Packaged desktop smoke
        run: node scripts/release/smoke-desktop.mjs --packaged
      - name: Upload fauna-windows-x64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fauna-windows-x64
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            release/win-unpacked
            reports/resources/
            reports/release-inventory/
            dist/dependencies.cdx.json
            dist/THIRD-PARTY-NOTICES.txt
      - id: complete
        name: Record successful workflow attempt
        run: node scripts/ci/ci.mjs stamp

  verify:
    needs: [prepare, static, unit, lineups, build, browser, interactions, windows]
    if: ${{ !cancelled() && needs.prepare.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_SHARDS: ${{ needs.prepare.outputs.total }}
      CI_BROWSER_WORKERS: ${{ needs.prepare.outputs.workers }}
      CI_NEEDS: ${{ toJSON(needs) }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: reports/playwright.json
      PLAYWRIGHT_HTML_OUTPUT_DIR: reports/browser-html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .node-version
            package.json
            package-lock.json
            playwright.config.ts
            scripts/
            src/
            tests/e2e/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Download browser-shard-*
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: browser-shard-*
          path: reports/shards
      - name: Download browser-manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: browser-manifest
          path: reports/ci
      - name: Download unit-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: unit-results
          path: reports
      - name: Download lineup-results-*
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          pattern: lineup-results-*
          path: reports/lineups
      - name: Download interaction-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: interaction-results
          path: reports/interactions
      - name: Collect shard blobs
        if: always()
        run: node scripts/ci/ci.mjs collect
      - name: Merge browser results
        if: always()
        run: npx playwright merge-reports --reporter=json,html all-blob-reports
      - name: Make merged JSON evidence portable
        if: always()
        run: node scripts/ci/ci.mjs portable
      - name: Summarize browser results
        if: always()
        run: node scripts/ci/ci-summarize.mjs playwright reports/playwright.json
      - name: Capture stage and runner timings
        if: always()
        run: node scripts/ci/ci-timings.mjs "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require every job and complete first-attempt results
        if: always()
        run: node scripts/ci/ci.mjs gate
      - name: Summarize complete unit results
        if: always()
        run: node scripts/ci/ci-summarize.mjs vitest reports/vitest-merged.json
      - name: Upload unit-review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-review
          overwrite: true
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
          path: |
            reports/vitest-merged.json
            reports/ci/unit-timings.json
      - name: Upload browser-review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-review
          overwrite: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
          path: |
            reports/playwright.json
            reports/browser-html/
            reports/ci/browser-durations.json
            reports/ci/browser-plan.json
            reports/ci/browser-timings.json
            reports/ci/evidence.json
            reports/ci/timings-*.json

  provenance:
    needs: [verify]
    if: ${{ needs.verify.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified Windows artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fauna-windows-x64
          path: candidate
      - name: Attest verified Steam candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            candidate/release/win-unpacked/Fauna.exe
            candidate/release/win-unpacked/resources/app.asar
      - name: Attest Steam candidate dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            candidate/release/win-unpacked/Fauna.exe
            candidate/release/win-unpacked/resources/app.asar
          sbom-path: candidate/dist/dependencies.cdx.json
