name: Verify Fauna
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - run: npm run test:interactions -- --seed 42 --steps 12 --out reports/interactions/ci
      - name: Summarize unit and browser results
        if: always()
        run: |
          node scripts/ci-summarize.mjs vitest reports/vitest.json
          node scripts/ci-summarize.mjs playwright reports/playwright.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          retention-days: 7
          path: |
            reports/
            test-results/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run verify:package
      - run: node scripts/smoke-desktop.mjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: fauna-windows-x64
          path: release/win-unpacked
