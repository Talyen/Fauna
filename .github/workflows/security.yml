name: Scheduled dependency security
on:
  schedule:
    - cron: "23 10 * * 4"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-dependency-security
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject advisories
        run: npm run security:audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduled-dependency-audit
          retention-days: 30
          if-no-files-found: error
          path: reports/security/
