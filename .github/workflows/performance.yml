name: Performance observations
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      memory_baseline:
        description: Optional commit for three paired native-memory trials on this runner
        type: string
        default: ""
      trace:
        description: Capture a bounded deep trace for the preview scenario
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-memory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies and Electron
        run: npm ci --no-audit --no-fund
      - name: Build renderer
        run: npm run build
      - name: Observe native startup, battle and menu memory
        run: |
          npm run perf -- --electron --cold --out reports/performance/native-startup
          npm run perf -- --electron --scenario battle --out reports/performance/native-battle
          npm run perf -- --electron --scenario resource-menus --out reports/performance/native-menus
      - name: Compare optional baseline with matching capture instrumentation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.memory_baseline != '' }}
        env:
          BASELINE_REF: ${{ inputs.memory_baseline }}
        run: |
          $current = $PWD.Path
          $baseline = Join-Path $env:RUNNER_TEMP 'fauna-memory-baseline'
          git fetch --no-tags origin $env:BASELINE_REF --depth=1
          if ($LASTEXITCODE) { throw 'Baseline fetch failed' }
          $source = git rev-parse FETCH_HEAD
          git worktree add --detach $baseline $source
          if ($LASTEXITCODE) { throw 'Baseline checkout failed' }
          # Overlay capture-only tooling; production UI, game and desktop sources stay at baseline.
          $harness = @('scripts/performance/run-performance.mjs', 'scripts/performance/options.mjs', 'scripts/performance/metrics.mjs', 'scripts/performance/metrics.d.mts', 'scripts/lib/tool-runtime.mjs', 'src/tooling/performance.ts')
          foreach ($file in $harness) { Copy-Item (Join-Path $current $file) (Join-Path $baseline $file) }
          Push-Location $baseline
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Baseline dependency installation failed' }
          npm run build
          if ($LASTEXITCODE) { throw 'Baseline build failed' }
          Pop-Location
          @{ baseline = $source; treatment = '${{ github.sha }}'; instrumentationOverlay = $harness; trials = 3; order = 'baseline then treatment within each trial' } | ConvertTo-Json -Depth 3 | Set-Content reports/performance/memory-comparison.json
          for ($trial = 1; $trial -le 3; $trial++) {
            foreach ($variant in @('baseline', 'treatment')) {
              Push-Location $(if ($variant -eq 'baseline') { $baseline } else { $current })
              npm run perf -- --electron --cold --out "reports/performance/paired/$variant/trial-$trial/startup"
              if ($LASTEXITCODE) { throw 'Startup capture failed' }
              npm run perf -- --electron --scenario battle --out "reports/performance/paired/$variant/trial-$trial/battle"
              if ($LASTEXITCODE) { throw 'Battle capture failed' }
              npm run perf -- --electron --scenario resource-menus --out "reports/performance/paired/$variant/trial-$trial/menus"
              if ($LASTEXITCODE) { throw 'Menu capture failed' }
              Pop-Location
            }
          }
          Copy-Item -Recurse (Join-Path $baseline 'reports/performance/paired/baseline') reports/performance/paired/baseline
      - name: Retain native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory-${{ github.sha }}
          retention-days: 30
          path: reports/performance/
  paired:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build compiler renderer
        run: npm run build
      - name: Observe background effects in battle and menus
        run: npx playwright test --config=playwright.performance.config.ts
      - name: Prove synthetic hitch attribution
        run: npm run perf -- --scenario diagnostic-stall --out reports/performance/diagnostic-stall
      - name: Compare span recorder overhead
        run: |
          npm run perf -- --scenario preview --spans off --out reports/performance/recorder-inactive
          npm run perf -- --scenario preview --out reports/performance/recorder-active
          npm run perf -- overhead reports/performance/recorder-inactive/report.json reports/performance/recorder-active/report.json reports/performance/recorder-overhead
      - name: Capture requested deep trace
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trace }}
        run: npm run perf -- --scenario preview --trace --out reports/performance/preview-trace
      - name: Exercise compiler build in browser journeys
        run: >-
          npm run test:e2e -- tests/e2e/combat.spec.ts tests/e2e/persistence.spec.ts
          tests/e2e/battle-targeting.spec.ts tests/e2e/menu-input.spec.ts
          --reporter=list,json --output=reports/performance/compiler-browser-results
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/performance/compiler-browser.json
      - name: Preserve compiler renderer
        run: cp -a dist "$RUNNER_TEMP/fauna-compiler-dist"
      - name: Build uncompiled comparison renderer
        run: npm run build
        env:
          FAUNA_REACT_COMPILER: "0"
      - name: Preserve uncompiled comparison renderer
        run: cp -a dist "$RUNNER_TEMP/fauna-baseline-dist"
      - name: Capture counterbalanced compiler comparisons
        run: |
          set -euo pipefail
          for trial in 1 2 3 4; do
            if (( trial == 1 || trial == 4 )); then
              variants=(baseline compiler)
            else
              variants=(compiler baseline)
            fi
            for variant in "${variants[@]}"; do
              rm -rf dist
              cp -a "$RUNNER_TEMP/fauna-$variant-dist" dist
              npm run perf -- --out "reports/performance/$variant-$trial"
            done
            npm run perf:compare -- "reports/performance/baseline-$trial/report.json" "reports/performance/compiler-$trial/report.json" "reports/performance/comparison-$trial"
          done
          baseline=$(jq -er '.buildIdentity' reports/performance/baseline-1/report.json)
          compiler=$(jq -er '.buildIdentity' reports/performance/compiler-1/report.json)
          test "$baseline" != "$compiler"
          for trial in 1 2 3 4; do
            jq -e --arg identity "$baseline" '.buildIdentity == $identity' "reports/performance/baseline-$trial/report.json" > /dev/null
            jq -e --arg identity "$compiler" '.buildIdentity == $identity' "reports/performance/compiler-$trial/report.json" > /dev/null
          done
          jq -n --arg baseline "$baseline" --arg compiler "$compiler" \
            '{baselineBuild: $baseline, compilerBuild: $compiler, order: [["baseline", "compiler"], ["compiler", "baseline"], ["compiler", "baseline"], ["baseline", "compiler"]]}' \
            > reports/performance/compiler-comparison.json
      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-observations-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: reports/performance/
